# Model → publisher mapping for herdr-jcode model metadata reporting.
# Each entry maps a normalized model sub-string (matched case-insensitively)
# to a provider glyph identifier.
#
# Provider identifiers correspond to approved glyph names in HerdrAgentIconsMax
# icon font: claude, gpt, kimi, qwen, deepseek, glm-v

[mapping]
"opus" = "claude"
"sonnet" = "claude"
"haiku" = "claude"
"fabel" = "claude"
"gpt" = "gpt"
"kimi" = "kimi"
"qwen" = "qwen"
"deepseek" = "deepseek"
"glm" = "glm-v"